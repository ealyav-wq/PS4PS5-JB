<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zeroday</title>
    <!-- launch.js contract — all class names on their elements are unchanged:
         form#pick  input[name=payload]  input#auto  #count  #cache
         html.landing  .shell  .meme  .panel  .lede  .soon
         .pick  .opt  .opt-auto  .btn  .count  .byline
         style.css is not linked; all styles are embedded.           -->
    <style>
      :root {
        --bg:     #090909;
        --surf:   #0f0f0f;
        --deep:   #060606;
        --bdr:    #1e1e1e;
        --bdr2:   #2e2e2e;
        --text:   #c0c0c0;
        --bright: #e8e8e8;
        --dim:    #585858;
        --faint:  #2a2a2a;
        --red:    #cc2222;
        --amber:  #c8a000;
        --white:  #f0f0f0;
        --mono:   "Courier New", Courier, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 var(--mono);
      }

      /* ── brand bar ───────────────────────────────────────────── */
      #brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        background: var(--surf);
        border-bottom: 1px solid var(--bdr);
        border-left: 3px solid var(--red);
      }

      #brand b {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: var(--white);
        text-transform: uppercase;
      }

      .brand-sub {
        font-size: 11px;
        letter-spacing: 0.15em;
        color: var(--red);
        text-transform: uppercase;
      }

      /* ── layout ──────────────────────────────────────────────── */
      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 20px 70px;
      }

      /* ── SVG splash (replaces meme.png) ──────────────────────── */
      .meme {
        display: block;
        width: 100%;
        max-width: 360px;
        margin-bottom: 28px;
        flex-shrink: 0;
      }

      /* ── form card ───────────────────────────────────────────── */
      .panel {
        width: 100%;
        max-width: 380px;
        background: var(--surf);
        border: 1px solid var(--bdr);
        border-left: 3px solid var(--red);
      }

      /* ── firmware info line ──────────────────────────────────── */
      .lede {
        margin: 0;
        padding: 14px 18px;
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--bdr);
      }

      .soon {
        color: var(--amber);
      }

      /* ── form wrapper ────────────────────────────────────────── */
      .pick {
        display: flex;
        flex-direction: column;
        padding: 14px 18px 16px;
      }

      /* ── option rows ─────────────────────────────────────────── */
      .opt {
        display: flex;
        align-items: center;
        padding: 13px 14px;
        margin-bottom: 6px;
        background: var(--deep);
        border: 1px solid var(--bdr);
        cursor: pointer;
        min-height: 50px;
      }

      .opt:hover {
        border-color: var(--bdr2);
        background: #111111;
      }

      .opt:active {
        opacity: 0.8;
      }

      .opt:focus-within {
        border-color: var(--white);
      }

      .opt input[type="radio"],
      .opt input[type="checkbox"] {
        margin: 0 14px 0 0;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        cursor: pointer;
        accent-color: var(--white);
      }

      .opt span {
        font-size: 14px;
        font-weight: 400;
        color: var(--bright);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* ── autostart (subtler) ─────────────────────────────────── */
      .opt-auto {
        border-style: dashed;
        margin-top: 4px;
        margin-bottom: 14px;
        min-height: 44px;
      }

      .opt-auto span {
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.06em;
      }

      /* ── start button ────────────────────────────────────────── */
      .btn {
        width: 100%;
        padding: 16px;
        background: transparent;
        color: var(--white);
        border: 1px solid var(--bdr2);
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        cursor: pointer;
        min-height: 54px;
        margin-bottom: 12px;
        position: relative;
      }

      .btn::before {
        content: "[ ";
        color: var(--dim);
      }

      .btn::after {
        content: " ]";
        color: var(--dim);
      }

      .btn:hover {
        background: var(--white);
        color: var(--bg);
        border-color: var(--white);
      }

      .btn:hover::before,
      .btn:hover::after {
        color: var(--bg);
      }

      .btn:active {
        opacity: 0.8;
      }

      .btn:focus-visible {
        outline: 2px solid var(--white);
        outline-offset: 2px;
      }

      /* ── count / cache (written by launch.js) ────────────────── */
      .count {
        margin: 0 0 4px;
        font-size: 10px;
        color: var(--faint);
        font-family: var(--mono);
        letter-spacing: 0.06em;
        min-height: 1em;
      }

      /* ── byline ──────────────────────────────────────────────── */
      .byline {
        position: fixed;
        bottom: 10px;
        left: 20px;
        right: 20px;
        margin: 0;
        color: var(--faint);
        font: 10px/1 var(--mono);
        letter-spacing: 0.08em;
      }

      /* ── desktop: image left, form right ─────────────────────── */
      @media (min-width: 580px) {
        .shell {
          flex-direction: row;
          align-items: flex-start;
          justify-content: center;
          padding-top: 48px;
        }
        .meme {
          margin-bottom: 0;
          margin-right: 36px;
          max-width: 310px;
        }
      }
    </style>
  </head>
  <body>

    <div id="brand">
      <b>Zeroday</b>
      <span class="brand-sub">by&nbsp;ELYA</span>
    </div>

    <div class="shell">

      <!--
        Inline SVG — replaces meme.png, no external file needed.
        Designed to look like a terminal screen from Mr. Robot.
        Static geometry only, nothing animates here.
      -->
      <svg class="meme" viewBox="0 0 360 290" xmlns="http://www.w3.org/2000/svg">

        <!-- ── background ────────────────────────────────────── -->
        <rect width="360" height="290" fill="#090909"/>

        <!-- ── left red accent bar (signature Mr. Robot edge) ── -->
        <rect x="0" y="0" width="3" height="290" fill="#cc2222"/>

        <!-- ── outer terminal frame ─────────────────────────── -->
        <rect x="14" y="10" width="332" height="270"
              fill="none" stroke="#1e1e1e" stroke-width="1"/>

        <!-- ── title bar ─────────────────────────────────────── -->
        <rect x="14" y="10" width="332" height="30" fill="#0f0f0f"/>

        <!-- title bar text -->
        <text x="30" y="29"
              font-family="Courier New, monospace"
              font-size="11" font-weight="700"
              fill="#585858" letter-spacing="3">ZERODAY</text>

        <text x="330" y="29" text-anchor="end"
              font-family="Courier New, monospace"
              font-size="10" fill="#2e2e2e" letter-spacing="1">by ELYA</text>

        <!-- ── separator after title ─────────────────────────── -->
        <line x1="14" y1="40" x2="346" y2="40"
              stroke="#1e1e1e" stroke-width="1"/>

        <!-- ── terminal prompt and output ────────────────────── -->

        <!-- prompt line -->
        <text x="30" y="58"
              font-family="Courier New, monospace" font-size="11"
              fill="#e8e8e8">root@fsociety:~#
        </text>
        <text x="181" y="58"
              font-family="Courier New, monospace" font-size="11"
              fill="#c0c0c0">./zeroday --exec</text>

        <!-- output lines -->
        <text x="30" y="74"
              font-family="Courier New, monospace" font-size="11"
              fill="#3a3a3a">[.] loading exploit chain</text>
        <text x="30" y="89"
              font-family="Courier New, monospace" font-size="11"
              fill="#3a3a3a">[.] target fw  :  13.52 / 14.00</text>
        <text x="30" y="104"
              font-family="Courier New, monospace" font-size="11"
              fill="#3a3a3a">[.] method     :  kernel exploit</text>
        <text x="30" y="119"
              font-family="Courier New, monospace" font-size="11"
              fill="#3a3a3a">[.] status     :  awaiting user</text>

        <!-- cursor blink simulation (static underscore) -->
        <text x="30" y="134"
              font-family="Courier New, monospace" font-size="11"
              fill="#585858">_</text>

        <!-- ── mid separator ─────────────────────────────────── -->
        <line x1="14" y1="146" x2="346" y2="146"
              stroke="#1a1a1a" stroke-width="1"/>

        <!-- ── ZERODAY large wordmark ─────────────────────────── -->
        <text x="30" y="184"
              font-family="Courier New, monospace"
              font-size="34" font-weight="700"
              fill="#f0f0f0" letter-spacing="4">ZERODAY</text>

        <!-- ── ELYA credit in red ─────────────────────────────── -->
        <text x="30" y="204"
              font-family="Courier New, monospace"
              font-size="11" fill="#cc2222"
              letter-spacing="3">by ELYA</text>

        <!-- ── lower separator ───────────────────────────────── -->
        <line x1="14" y1="216" x2="346" y2="216"
              stroke="#161616" stroke-width="1"/>

        <!-- ── firmware compatibility ────────────────────────── -->
        <text x="30" y="232"
              font-family="Courier New, monospace"
              font-size="10" fill="#444444"
              letter-spacing="1">firmware  :  13.52 / 14.00</text>

        <!-- ── original creator credit ───────────────────────── -->
        <line x1="14" y1="244" x2="346" y2="244"
              stroke="#141414" stroke-width="1"/>

        <text x="30" y="260"
              font-family="Courier New, monospace"
              font-size="9" fill="#2e2e2e"
              letter-spacing="1">exploit engine: well0nez / m0zz</text>

      </svg>

      <main class="panel">
        <p class="lede">PS4 kernel exploit &middot; 13.52, 14.00 <span class="soon">&middot; 14.02 soon</span></p>

        <form class="pick" id="pick">

          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen</span>
          </label>

          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>autostart</span>
          </label>

          <button class="btn" type="submit">start</button>

          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>

        </form>
      </main>

    </div>

    <p class="byline">exploit by well0nez / m0zz</p>
    <script src="launch.js"></script>
  </body>
</html>

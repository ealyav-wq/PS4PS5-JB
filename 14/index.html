<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>afterglow</title>
    <!-- launch.js contract: form#pick, input[name=payload], #auto checkbox,
         #count, #cache  — ALL preserved exactly. style.css is no longer
         referenced; styles are embedded here instead. -->
    <style>
      :root {
        --bg:    #080b08;
        --panel: #0b0f0b;
        --sunk:  #060906;
        --line:  #1c2a1c;
        --fg:    #9cbf9c;
        --bright:#c8f0c8;
        --dim:   #4a6b4a;
        --faint: #2d3f2d;
        --ok:    #39d353;
        --bad:   #f85149;
        --warn:  #d29922;
        --neon:  #00ff41;
        --sans:  "Courier New", Courier, monospace;
        --mono:  "Courier New", Courier, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 var(--sans);
      }

      /* ── brand bar ── */
      #brand {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--neon);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #brand b::before { content: "[ "; color: var(--dim); }
      #brand b::after  { content: " ]"; color: var(--dim); }

      /* ── layout ── */
      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 20px 60px;
      }

      /* ── SVG image (replaces meme.png) ── */
      .meme {
        display: block;
        width: 100%;
        max-width: 380px;
        margin-bottom: 24px;
      }

      /* ── main panel ── */
      .panel {
        width: 100%;
        max-width: 380px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 3px solid var(--neon);
        border-radius: 4px;
        padding: 22px 20px 18px;
      }

      /* ── lede line ── */
      .lede {
        margin: 0 0 20px;
        font-size: 14px;
        color: var(--bright);
        letter-spacing: 0.5px;
        line-height: 1.6;
      }
      .lede::before {
        content: "> ";
        color: var(--neon);
      }
      .soon {
        color: var(--warn);
        font-size: 12px;
      }

      /* ── option rows ── */
      .pick {
        display: flex;
        flex-direction: column;
      }

      .opt {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--sunk);
        cursor: pointer;
      }

      .opt:hover {
        border-color: var(--neon);
      }

      .opt input[type="radio"],
      .opt input[type="checkbox"] {
        margin-right: 10px;
        accent-color: var(--neon);
      }

      .opt span {
        color: var(--bright);
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .opt-auto {
        border-style: dashed;
        margin-top: 4px;
        margin-bottom: 14px;
      }

      .opt-auto span {
        color: var(--dim);
        font-weight: normal;
      }

      /* ── start button ── */
      .btn {
        width: 100%;
        padding: 14px;
        background: var(--sunk);
        color: var(--neon);
        border: 2px solid var(--neon);
        border-radius: 3px;
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        margin-bottom: 12px;
      }

      .btn:hover {
        background: var(--panel);
        color: var(--bright);
      }

      .btn:active {
        opacity: 0.75;
      }

      .btn:focus-visible {
        outline: 2px solid var(--bright);
        outline-offset: 2px;
      }

      /* ── count / cache lines (managed by launch.js) ── */
      .count {
        margin: 4px 0 0;
        font-size: 11px;
        color: var(--dim);
        font-family: var(--mono);
        min-height: 1em;
        letter-spacing: 0.5px;
      }

      /* ── byline ── */
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }

      @media (min-width: 600px) {
        .shell {
          flex-direction: row;
          align-items: flex-start;
          justify-content: center;
          padding-top: 40px;
        }
        .meme {
          margin-bottom: 0;
          margin-right: 32px;
          max-width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div id="brand"><b>afterglow</b></div>

    <div class="shell">

      <!-- meme.png replaced with an inline SVG terminal display -->
      <svg class="meme" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
        <rect width="320" height="240" fill="#060906"/>
        <rect x="0" y="0" width="320" height="2" fill="#00ff41"/>
        <rect x="0" y="238" width="320" height="2" fill="#00ff41"/>
        <rect x="0" y="0" width="2" height="240" fill="#00ff41"/>
        <rect x="318" y="0" width="2" height="240" fill="#00ff41"/>

        <!-- inner box -->
        <rect x="16" y="16" width="288" height="208" fill="none" stroke="#1c2a1c" stroke-width="1"/>

        <!-- top label -->
        <text x="160" y="38" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#2d3f2d" letter-spacing="3">ROOT@FSOCIETY:~</text>

        <!-- fsociety ASCII art letters -->
        <text x="30" y="80" font-family="Courier New, monospace" font-size="13" fill="#00ff41" letter-spacing="1">___ ___</text>
        <text x="30" y="96" font-family="Courier New, monospace" font-size="13" fill="#00ff41" letter-spacing="1">| __|/ __| ___  ___</text>
        <text x="30" y="112" font-family="Courier New, monospace" font-size="13" fill="#00ff41" letter-spacing="1">| _| \__ \/ _ \/ __| e t y</text>
        <text x="30" y="128" font-family="Courier New, monospace" font-size="13" fill="#00ff41" letter-spacing="1">|_|  |___/\___/\___| i  i</text>

        <!-- divider -->
        <line x1="30" y1="142" x2="290" y2="142" stroke="#1c2a1c" stroke-width="1"/>

        <!-- status lines -->
        <text x="30" y="160" font-family="Courier New, monospace" font-size="11" fill="#4a6b4a">[ kernel exploit loaded ]</text>
        <text x="30" y="176" font-family="Courier New, monospace" font-size="11" fill="#4a6b4a">[ fw 13.52 / 14.00 ]</text>
        <text x="30" y="195" font-family="Courier New, monospace" font-size="11" fill="#2d3f2d">we are fsociety_<tspan fill="#00ff41">&#9608;</tspan></text>
      </svg>

      <main class="panel">
        <p class="lede">PS4 kernel exploit &middot; 13.52, 14.00 <span class="soon">&middot; 14.02 soon</span></p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>autostart</span>
          </label>

          <button class="btn" type="submit">start</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <p class="byline">by well0nez/m0zz</p>
    <script src="launch.js"></script>
  </body>
</html>

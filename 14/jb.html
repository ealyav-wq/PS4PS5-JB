<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ELYA // FSOCIETY PS4 EXPLOIT TERMINAL</title>

<style>
:root {
  --bg: #050505;
  --panel: #0d0d0d;
  --panel2: #141414;
  --line: #2a080c;
  --red: #ff003c;
  --red-dim: #80001e;
  --red-glow: rgba(255, 0, 60, 0.4);
  --text-white: #f0f0f0;
  --dim: #777777;
  --yellow: #ffb703;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  outline: none;
}

html, body {
  min-height: 100%;
}

html {
  background: var(--bg);
}

body {
  min-height: 100vh;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;

  background:
    radial-gradient(ellipse at 50% 0%, #200008 0%, transparent 65%),
    var(--bg);

  color: var(--text-white);
  font-family: Consolas, "Courier New", monospace;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

/* SCANLINE EFFECT */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0, 0, 0, 0.25) 3px
  );
}

/* SUBTLE TERMINAL GRID */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 0, 60, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 0, 60, 0.03) 1px, transparent 1px);
  background-size: 30px 30px;
}

/* BRAND HEADER - E-CORP / ELYA STYLE */
#brand {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto 14px;
  padding: 14px 18px;
  border: 1px solid var(--red-dim);
  border-left: 4px solid var(--red);
  background: rgba(13, 13, 13, 0.95);
  color: var(--red);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 3px;
  text-shadow: 0 0 10px var(--red-glow);
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#brand b {
  font-weight: 900;
  color: var(--text-white);
}

#brand .sub {
  display: block;
  margin-top: 4px;
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: normal;
  text-shadow: none;
}

.e-logo {
  font-size: 24px;
  font-weight: 900;
  color: var(--red);
  border: 2px solid var(--red);
  padding: 0px 8px;
  display: inline-block;
  line-height: 1;
  transform: rotate(-5deg);
  box-shadow: 0 0 8px var(--red-glow);
}

/* RAM MONITOR */
#ramBox {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto 12px;
  padding: 10px 14px;
  border: 1px solid #1a1a1a;
  background: rgba(10, 10, 10, 0.95);
  color: var(--text-white);
  font-family: Consolas, "Courier New", monospace;
  font-size: 11px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  position: relative;
  z-index: 1;
}

#ramBox::before {
  content: "[ ELYA MEMORY_MONITOR // SYSTEM_OVERRIDE ]";
  display: block;
  margin-bottom: 4px;
  color: var(--red);
  font-size: 9px;
  letter-spacing: 2px;
}

/* SPINNER */
#spin {
  width: 32px;
  height: 32px;
  margin: 20px auto;
  border: 2px solid #200008;
  border-top-color: var(--red);
  border-right-color: var(--red);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  box-shadow: 0 0 15px var(--red-glow);
  position: relative;
  z-index: 1;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* MAIN MSG */
#msg {
  width: 100%;
  max-width: 1050px;
  margin: 10px auto;
  color: var(--red);
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 2px;
  line-height: 1.8;
  text-align: center;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

/* TERMINAL WRAPPER */
#wrap {
  width: 100%;
  max-width: 1050px;
  margin: 12px auto 0;
  border: 1px solid var(--red-dim);
  background: rgba(8, 8, 8, 0.98);
  box-shadow: 0 0 25px rgba(0,0,0,.8), 0 0 15px var(--red-glow);
  position: relative;
  z-index: 1;
}

/* TERMINAL STATE HEADER */
#state {
  min-height: 39px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: #120305;
  color: var(--red);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.5px;
  line-height: 1.5;
  text-transform: uppercase;
}

#state::before {
  content: "root@ELYA:~# ";
  color: var(--dim);
}

/* TERMINAL OUTPUT */
#out {
  min-height: 230px;
  max-height: 65vh;
  overflow: auto;
  padding: 16px;
  background: #040404;
  color: #dddddd;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.85;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  -webkit-overflow-scrolling: touch;
}

/* PS4 D-PAD CONTROLLER FOCUS STYLES */
#wrap:focus,
#out:focus,
div:focus {
  border-color: var(--yellow) !important;
  box-shadow: 0 0 10px rgba(255, 183, 3, 0.5) !important;
}

/* STATES HANDLING */
body.log #spin,
body.log #msg {
  display: none;
}

body.log #wrap {
  display: block;
}

/* ACCESS GRANTED SUCCESS STATE */
body.done #spin {
  display: none;
}

body.done #msg {
  color: var(--red);
  animation: successFlash .8s ease-out;
}

body.done #msg::before {
  content: "[ CONTROL IS AN ILLUSION ] ";
}

body.done #msg::after {
  content: "SYSTEM COMPROMISED // HELLO, FRIEND. EXIT BROWSER.";
  display: block;
  margin: 15px auto 0;
  padding: 15px;
  border: 1px solid var(--red);
  background: rgba(255, 0, 60, 0.1);
  color: var(--red);
  font-size: 13px;
  letter-spacing: 2px;
  box-shadow: 0 0 20px var(--red-glow);
  animation: reveal .8s ease-out;
}

body.done #wrap {
  border-color: var(--red);
  box-shadow: 0 0 25px var(--red-glow);
}

body.done #state {
  color: var(--text-white);
  background: #200008;
}

@keyframes successFlash {
  0% { opacity: .1; transform: scale(.97); }
  50% { opacity: 1; transform: scale(1.03); }
  100% { transform: scale(1); }
}

@keyframes reveal {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* FAILURE STATE */
body.fail #spin {
  display: none;
}

body.fail #msg {
  color: var(--red);
}

body.fail #msg::before {
  content: "[ PAYLOAD EXPLOIT FAILED ] ";
}

body.fail #wrap {
  border-color: #550000;
}

body.fail #state {
  color: var(--red);
}

.ok { color: #00ff66; }
.bad { color: var(--red); }
.warn { color: var(--yellow); }

code {
  padding: 2px 5px;
  background: #1a0005;
  color: var(--red);
  font-family: Consolas, "Courier New", monospace;
}

/* FOOTER */
.byline {
  width: 100%;
  max-width: 1050px;
  margin: 18px auto 0;
  color: #555555;
  font-size: 9px;
  letter-spacing: 2px;
  text-align: center;
  position: relative;
  z-index: 1;
}

@media (max-width: 600px) {
  body { padding: 12px 9px; }
  #brand { font-size: 13px; letter-spacing: 2px; }
  #out { min-height: 200px; padding: 12px; font-size: 11px; }
  #ramBox { font-size: 10px; }
}
</style>
</head>

<body>

<div id="brand" tabindex="0">
  <div>
    ELYA <b>// FSOCIETY PS4 HOST</b>
    <span class="sub">UNAUTHORIZATION & ROOT PRIVILEGE EXPLOIT</span>
  </div>
  <div class="e-logo">E</div>
</div>

<div id="ramBox" tabindex="0">RAM: checking...</div>

<div id="spin"></div>

<div id="msg">Restart your console</div>

<div id="wrap" tabindex="0">
  <div id="state"></div>
  <div id="out"></div>
</div>

<p class="byline">ELYA CORP &copy; 2026 // ALL RIGHTS RESERVED // CONTROL IS AN ILLUSION</p>

<script type="module">
  import "./jb.js";
</script>

</body>
</html>

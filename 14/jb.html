<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zeroday</title>
    <!-- jb.js contract: #brand #ramBox #spin #msg #wrap #state #out
         body classes: .done .fail .log
         element classes: .notice .byline .ok .bad .warn code
         ALL preserved exactly. Only the visual layer changes. -->
    <style>
      :root {
        --bg:    #080b08;
        --panel: #0b0f0b;
        --sunk:  #060906;
        --line:  #1c2a1c;
        --fg:    #9cbf9c;
        --bright:#c8f0c8;
        --dim:   #4a6b4a;
        --faint: #2d3f2d;
        --ok:    #39d353;
        --bad:   #f85149;
        --warn:  #d29922;
        --neon:  #00ff41;
        --sans:  "Courier New", Courier, monospace;
        --mono:  "Courier New", Courier, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 var(--sans);
      }

      /* ── brand bar ── */
      #brand {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--neon);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #brand b::before { content: "[ "; color: var(--dim); }
      #brand b::after  { content: " ]"; color: var(--dim); }

      /* ── ram readout ── */
      #ramBox {
        overflow: hidden;
        padding: 5px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ramBox::before { content: "> "; color: var(--dim); }

      /* ── spinner ── */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 3px solid var(--line);
        border-top-color: var(--neon);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── status text ── */
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state, #out { display: none; }

      body.done #spin, body.fail #spin { display: none; }
      body.fail #msg  { display: block; }
      body.done #msg  {
        display: block;
        color: var(--neon);
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ── log view ── */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin, body.log #msg { display: none; }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        color: var(--neon);
        letter-spacing: 1px;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
        color: var(--fg);
      }

      /* ── retry notice -- raised by jb.js ── */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid var(--bad);
        background: #1a0808;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }

      /* ── byline ── */
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }

      /* ── utility classes used by jb.js ── */
      .ok   { color: var(--ok);   }
      .bad  { color: var(--bad);  }
      .warn { color: var(--warn); }
      code  { color: var(--neon); }
    </style>
  </head>
  <body>
    <div id="brand"><b>Zeroday.</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">elya original by well0nez/m0zz</p>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>

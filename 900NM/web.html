<!DOCTYPE html>
<html lang="en">
<head>

<title>Loading...</title>
<style>
  /* Keep preloaded elements completely hidden from view */
  .preload-container {
    opacity: 0;
    position: absolute;
    pointer-events: none;
    height: 0;
    overflow: hidden;
  }
</style>
</head>
<body>

<!-- Preload necessary fonts and DOM elements before exploit -->

      <th>H1</th>
      <th>H2</th>

<script>
function loadScript(path)
{
    var xhr = new XMLHttpRequest();
    xhr.open("GET", path, false);
    xhr.send('');
    return xhr.responseText;
}

setTimeout(function(){
eval.call(window, loadScript('netcat.js')
+loadScript('wexploit.js')
+loadScript('malloc.js')
+loadScript('ropb2.js')

+loadScript('payload.js')
+loadScript('relocator.js')
+loadScript('frontend.js'));
if(document.getElementById('q')) {
    document.getElementById('q').innerHTML = 'Some other text';
}
}, 50);
</script>

.top-bar {

  margin-bottom: 25px;
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding-bottom: 15px;
}

.stats-row {

  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
}

.stat-badge {

  border-radius: 50px;
  padding: 8px 20px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

.stat-pass { color: var(--accent-green); }
.stat-fail { color: var(--accent-red); }

.main-title {

  color: var(--accent-gold);
  margin-bottom: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

#msgs2 {

  margin-bottom: 30px;
  font-weight: 500;
  min-height: 24px;
}

.content {
  background: rgba(8, 9, 13, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
}

.yellow {
  color: var(--accent-gold);
  font-weight: 600;
}

.hue {
  color: white;
  padding: 6px 18px;
  border-radius: 25px;
  animation: hue 6s linear infinite;
  -webkit-animation: hue 6s linear infinite;
  box-shadow: 0 0 25px rgba(243, 156, 18, 0.5);
  background: rgba(243, 156, 18, 0.2);
  font-weight: bold;
  letter-spacing: 1px;
  display: inline-block;
  margin-top: 5px;
}

@keyframes hue {
  0% { filter: hue-rotate(0deg); }
  50% { box-shadow: 0 0 35px var(--accent-gold); }
  100% { filter: hue-rotate(360deg); }
}

.special-thanks {
  margin-top: 20px;
  font-size: 14px;
  color: var(--text-muted);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 15px;
}

.special-thanks span {
  color: var(--text-main);
  font-weight: 500;
}
</style>

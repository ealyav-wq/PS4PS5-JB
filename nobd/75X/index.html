:root {
  --bg-color: #060709;
  --panel-bg: rgba(12, 14, 20, 0.85);

  --accent-green: #2ecc71;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --border-glow: rgba(243, 156, 18, 0.5);
}

body.bg {
  background-color: var(--bg-color);
  background-image: radial-gradient(circle at 50% -20%, #1e2235 0%, var(--bg-color) 70%);
  color: var(--text-main);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  padding: 25px;

  display: flex;

  justify-content: center;
}

#container-box {
  max-width: 600px;
  width: 100%;
  text-align: center;
  background: var(--panel-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  padding: 40px 30px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
}

.titleheadx {
  background: transparent;
  color: var(--accent-gold);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin-bottom: 15px;
  text-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
}

.content {
  margin-top: 30px;
  background: rgba(8, 9, 13, 0.75);
  color: white;
  font-size: 16px;
  text-align: center;
  border-radius: 20px;
  padding: 20px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
}

.hue {
  color: white;
  padding: 6px 18px;
  border-radius: 25px;
  animation: hue 6s linear infinite;
  -webkit-animation: hue 6s linear infinite;
  box-shadow: 0 0 25px rgba(243, 156, 18, 0.5);
  background: rgba(243, 156, 18, 0.2);
  font-weight: bold;
  letter-spacing: 1px;
}

@keyframes hue {
  0% { filter: hue-rotate(0deg); }
  50% { box-shadow: 0 0 35px var(--accent-gold); }
  100% { filter: hue-rotate(360deg); }
}

.special-thanks {
  margin-top: 15px;
  font-size: 14px;
  color: var(--text-muted);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 12px;
}

.special-thanks span {
  color: var(--text-main);
  font-weight: 500;
}

.text-yellow { color: var(--accent-gold); }

<!DOCTYPE html>
<html>
<head style="background-color:#050505;">
  <title>Elya Host for nobd 6.20 FW (on ChendoChap host base) and LM Payload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-color: #060709;
      --panel-bg: rgba(12, 14, 20, 0.85);
      --accent-gold: #f39c12;
      --accent-cyan: #00f2fe;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% -20%, #1e2235 0%, var(--bg-color) 70%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-container {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loader {
      border: 6px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      border-top: 6px solid var(--accent-gold);
      border-left: 6px solid var(--accent-cyan);
      width: 100px;
      height: 100px;
      -webkit-animation: spin 1s linear infinite;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 30px rgba(243, 156, 18, 0.2);
    }

    .info {
      position: fixed;
      top: 42%;
      left: 50%;
      color: var(--text-main);
      font-size: 32px;
      font-weight: 700;
      font-family: system-ui, sans-serif;
      transform: translate(-50%, -50%);
      text-align: center;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.5px;
    }

    .credits {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      font-family: system-ui, sans-serif;
      text-align: center;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 15px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      width: 85%;
      max-width: 550px;
    }

    .yellow {
      color: var(--accent-gold);
      font-weight: 600;
    }

    .hue {
      color: white;
      padding: 4px 14px;
      border-radius: 20px;
      animation: hue 6s linear infinite;
      -webkit-animation: hue 6s linear infinite;
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
      background: rgba(243, 156, 18, 0.2);
      font-weight: bold;
      letter-spacing: 1px;
      display: inline-block;
      margin-top: 6px;
    }

    .special-thanks {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    .special-thanks span {
      color: var(--text-main);
      font-weight: 500;
    }

    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
    @keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script>
    window.didload = 0;
    window.didpost = 0;

    window.onload = function () {
      window.didload = 1;
      if (window.didpost == 1)
        setTimeout(window.stage2, 1500);
    }
    window.postExpl = function () {
      window.didpost = 1;
      if (window.didload == 1)
        setTimeout(window.stage2, 1500);
    }

    function allset() {
      document.getElementById("loader-box").style.display = "none";
      document.getElementById("awaiting").style.display = "none";
      document.getElementById("allset").style.display = "block";
    }

    function awaitpl() {
      document.getElementById("loader-box").style.display = "none";
      document.getElementById("awaiting").style.display = "block";
    }

    function fail(info) {
      document.getElementById("loader-box").style.display = "none";
      document.getElementById("awaiting").style.display = "none";
      document.getElementById("fail").style.display = "block";
    }
  </script>

  <div id="loader-box" class="loader-container">
    <div class="loader"></div>
  </div>

  <div id="awaiting" class="info" style="display:none;">
    Payload Loaded
  </div>

  <div id="allset" class="info" style="display:none;">
    You're all set!
  </div>

  <div id="fail" class="info" style="display:none;">
    Something went wrong :(
  </div>

  <div id="badfw" class="info" style="display:none;">
    Only firmware 6.20 is supported!
  </div>

  <div class="credits">
    <div>
      <span class="yellow">Designed, Ported and Compiled by :</span><br>
      <span class="hue">elya</span>
    </div>
    <div class="special-thanks">
      <span>Special Thanks:</span> ChendoChap, LM, &amp; Scene Contributors[span_0](start_span)[span_0](end_span)
    </div>
  </div>

  <script src="./rop.js"></script>
  <script src="./syscalls.js"></script>
  <script src="./expl.js"></script>
  <script src="./userland.js"></script>
  <pre id="console" style="display:none;"></pre>
</body>
</html>

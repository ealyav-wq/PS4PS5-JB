    color: var(--accent-red) !important;

    margin-top: 25px;

    padding-top: 15px;

    font-size: 0.85rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;

    margin: 0;
    font-size: 0.8rem;

</head>

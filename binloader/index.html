<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binloader - Elya Host</title>
<style type="text/css">
:root {
  --bg-color: #060709;
  --panel-bg: rgba(12, 14, 20, 0.85);
  --accent-gold: #f39c12;
  --accent-cyan: #00f2fe;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --border-glow: rgba(243, 156, 18, 0.5);
}

body {
  background-color: var(--bg-color);
  background-image: radial-gradient(circle at 50% -20%, #1e2235 0%, var(--bg-color) 70%);
  color: var(--text-main);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  padding: 25px;
  min-height: 95vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#container {
  max-width: 800px;
  width: 100%;
  text-align: center;
  background: var(--panel-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  padding: 40px 20px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
}

.main-title {
  font-size: 24px;
  color: var(--accent-gold);
  margin-bottom: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

#msgs2 {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 30px;
  min-height: 24px;
  font-weight: 500;
}

.button-row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

button {
  background: linear-gradient(135deg, rgba(25, 28, 40, 0.9), rgba(15, 17, 24, 0.95));
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 50px;
  height: 48px;
  width: 180px;
  color: var(--text-main);
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover, button:focus {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 0 25px var(--border-glow);
  background: linear-gradient(135deg, rgba(35, 40, 58, 0.95), rgba(22, 25, 36, 0.95));
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  outline: none;
}

.back-btn {
  margin-top: 25px;
  display: inline-block;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  transition: color 0.2s;
}

.back-btn:hover {
  color: var(--accent-gold);
}
</style>
</head>
<body>

<div id="container">
  <h1 class="main-title">BINLOADER FOR 5.05, 6.72, 7.02 & 7.55</h1>
  <div id="msgs2">Status: Waiting for payload...</div>

  <div class="subtitle" style="font-size: 15px; color: var(--text-muted); margin-bottom: 20px; font-weight: 600;">SELECT FIRMWARE</div>

  <div class="button-row">
    <button onclick="msgs2.innerHTML='Status: Ready for 5.05 Payload (Port 9020)'">5.05</button>
    <button onclick="msgs2.innerHTML='Status: Ready for 6.72 Payload (Port 9020)'">6.72</button>
  </div>
  <div class="button-row">
    <button onclick="msgs2.innerHTML='Status: Ready for 7.02 Payload (Port 9020)'">7.02</button>
    <button onclick="msgs2.innerHTML='Status: Ready for 7.55 Payload (Port 9020)'">7.55</button>
  </div>

  <div>
    <a href="../index.html" class="back-btn">&larr; Back to Main Host</a>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title id="page-title">Elya Host Hub | Ultimate Exploit Station</title>
<style>
  :root {
    --bg-base: #030206;
    --bg-surface: rgba(15, 10, 26, 0.65);
    --bg-surface-hover: rgba(25, 16, 45, 0.85);
    --border-color: rgba(176, 38, 255, 0.2);
    --border-glow: rgba(255, 42, 133, 0.4);
    
    --accent-pink: #ff2a85;
    --accent-purple: #b026ff;
    --accent-cyan: #00f0ff;
    --accent-gold: #ffb703;
    --accent-green: #00ff66;
    
    --text-main: #f3e8ff;
    --text-muted: #9d8ec4;
    
    --sidebar-width: 280px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(176, 38, 255, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(255, 42, 133, 0.12) 0%, transparent 45%),
      linear-gradient(135deg, #030206 0%, #0a0414 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* SIDEBAR NAVIGATION */
  aside {
    width: var(--sidebar-width);
    background: rgba(10, 6, 18, 0.85);
    border-right: 1px solid var(--border-color);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 25px 20px;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    transition: transform 0.3s ease;
  }

  [dir="rtl"] aside {
    left: auto;
    right: 0;
    border-right: none;
    border-left: 1px solid var(--border-color);
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border-color);
  }

  .brand-logo {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 42, 133, 0.4);
  }

  .brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #fff, var(--text-muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .nav-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-grow: 1;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    text-align: left;
    [dir="rtl"] & { text-align: right; }
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.25s ease;
  }

  .nav-btn:hover, .nav-btn.active {
    background: rgba(176, 38, 255, 0.15);
    color: var(--accent-cyan);
    box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.05);
    transform: translateX(4px);
    [dir="rtl"] & { transform: translateX(-4px); }
  }

  .nav-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .sidebar-footer {
    padding-top: 15px;
    border-top: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  /* MAIN CONTENT AREA */
  main {
    flex-grow: 1;
    margin-left: var(--sidebar-width);
    [dir="rtl"] & {
      margin-left: 0;
      margin-right: var(--sidebar-width);
    }
    padding: 30px;
    max-width: calc(100% - var(--sidebar-width));
  }

  /* TOP HEADER BAR */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    padding: 15px 25px;
    border-radius: 16px;
    backdrop-filter: blur(10px);
    margin-bottom: 25px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .system-status {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    background-color: var(--accent-green);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent-green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 102, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
  }

  #msgs2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-cyan);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .widget-pill {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-pink);
  }

  .lang-toggle {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(176, 38, 255, 0.2));
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: var(--accent-cyan);
    padding: 8px 18px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .lang-toggle:hover {
    background: var(--accent-cyan);
    color: var(--bg-base);
    box-shadow: 0 0 20px var(--accent-cyan);
  }

  /* HERO BANNER */
  .hero-banner {
    background: linear-gradient(135deg, rgba(20, 12, 35, 0.8), rgba(40, 15, 60, 0.4));
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 35px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  .hero-banner::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,42,133,0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-title {
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    text-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
  }

  .hero-desc {
    color: var(--text-muted);
    font-size: 15px;
    max-width: 700px;
    line-height: 1.5;
  }

  /* SECTION & CARDS GRID */
  .section-container {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .section-title {
    font-size: 16px;
    color: var(--accent-purple);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(176, 38, 255, 0.4);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 15px;
  }

  /* REDESIGNED BUTTON CARDS */
  .exploit-card {
    background: rgba(15, 10, 26, 0.7);
    border: 1px solid rgba(255, 42, 133, 0.2);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    text-decoration: none;
    color: var(--text-main);
    font-weight: 700;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 80px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }

  .exploit-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255, 42, 133, 0.15), rgba(176, 38, 255, 0.15));
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .exploit-card:hover {
    border-color: var(--accent-pink);
    box-shadow: 0 0 25px rgba(255, 42, 133, 0.35), inset 0 0 15px rgba(176, 38, 255, 0.2);
    transform: translateY(-3px);
  }

  .exploit-card:hover::before {
    opacity: 1;
  }

  .exploit-card span {
    position: relative;
    z-index: 1;
  }

  /* Card Color Modifiers */
  .card-gold { color: var(--accent-gold) !important; border-color: rgba(255, 183, 3, 0.3); }
  .card-gold:hover { border-color: var(--accent-gold); box-shadow: 0 0 25px rgba(255, 183, 3, 0.4); }

  .card-green { color: var(--accent-green) !important; border-color: rgba(0, 255, 102, 0.3); }
  .card-green:hover { border-color: var(--accent-green); box-shadow: 0 0 25px rgba(0, 255, 102, 0.4); }

  /* FOOTER */
  .site-footer {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    backdrop-filter: blur(10px);
    margin-top: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .hue-badge {
    color: #fff;
    padding: 6px 18px;
    border-radius: 12px;
    animation: hueCycle 6s linear infinite;
    box-shadow: 0 0 20px var(--accent-pink);
    background: rgba(255, 42, 133, 0.3);
    border: 1px solid rgba(255, 42, 133, 0.6);
    display: inline-block;
    font-weight: 900;
    letter-spacing: 1px;
    margin-top: 8px;
  }

  @keyframes hueCycle {
    0% { filter: hue-rotate(0deg); box-shadow: 0px 0px 15px var(--accent-pink); }
    50% { box-shadow: 0px 0px 25px var(--accent-cyan); }
    100% { filter: hue-rotate(360deg); box-shadow: 0px 0px 15px var(--accent-purple); }
  }

  /* Responsive Design */
  @media (max-width: 900px) {
    aside { transform: translateX(-100%); }
    [dir="rtl"] aside { transform: translateX(100%); }
    aside.mobile-open { transform: translateX(0); }
    main { margin-left: 0; margin-right: 0; max-width: 100%; padding: 15px; }
  }
</style>

function updateClock() {
  const dt = new Date();
  let hour = dt.getHours();
  let minute = dt.getMinutes();
  let day = dt.getDate();
  let month = dt.getMonth() + 1;
  let year = dt.getFullYear();
  if (minute < 10) minute = "0" + minute;
  if (hour < 10) hour = "0" + hour;
  document.getElementById("date-widget").innerText = day + "/" + month + "/" + year;
  document.getElementById("clock-widget").innerText = hour + ":" + minute;
}

let currentLang = 'en';

function toggleLanguage() {

  const t = dictionary[currentLang];
  
  document.documentElement.setAttribute('lang', currentLang);

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PSH5JB - Elya Host</title>
  <style>
    :root {
      --bg:      #0b0e14;
      --surface: rgba(22, 27, 34, 0.85);
      --border:  rgba(255, 255, 255, 0.08);
      --text:    #f0f6fc;
      --gold:    #e3b341;
    }

    html, body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #161b22 0%, var(--bg) 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-weight: 700;
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .done-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="done-box">Exploit Complete // Done</div>
  <script>
    try { history.replaceState(null, "", location.href); } catch (e) {}
    try { window.close(); } catch (e) {}
  </script>
</body>
</html>

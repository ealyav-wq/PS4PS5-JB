<html manifest="Cache.manifest">
<head>
<meta charset="utf-8">
<title>Elya Host - PS4 Auto Exploit</title>
<style>
    :root {
        --bg-color: #0b0e14;
        --card-bg: #161b22;
        --accent-blue: #00e5ff;
        --accent-glow: rgba(0, 229, 255, 0.25);
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        min-height: 100vh;
        padding: 30px 20px;
        overflow: hidden;
    }

    .header-container {
        text-align: center;
        margin-top: 20px;
    }

    h1.main-title {
        color: var(--accent-blue);
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 15px var(--accent-glow);
        margin-bottom: 12px;
    }

    .status-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50px;
        padding: 10px 28px;
        display: inline-block;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    #progress {
        font-size: 20px;
        font-weight: 600;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .content {
        width: 100%;
        max-width: 750px;
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
        font-size: 16px;
        text-align: center;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        margin-bottom: 20px;
    }

    .credits-title {
        color: var(--accent-blue);
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .credits-author {
        color: #ffffff;
        font-weight: bold;
        font-size: 22px;
        margin-bottom: 20px;
    }

    .thanks-box {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 16px;
    }

    .thanks-title {
        color: #e3b341;
        font-weight: 700;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .thanks-list {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.6;
    }
</style>

<script>
      if (window.applicationCache.status === 0) {window.location.replace("cache.html");}
</script>
</head>

    <div class="header-container">

<script>

};

};
window.addEventListener('error', function (event) {
      var reason = event.error;
      var msg = 'Unhandled error\n';
      if (reason) {
        msg += reason + '\n';

          msg += reason.sourceURL;
        if (reason.line)
          msg += ':' + reason.line;
        if (reason.column)
          msg += ':' + reason.column;
        if (reason.stack)
          msg += '\n' + reason.stack;
      } else {
        msg += 'No error object';
      }
      alert(msg);
      return true;
});

</html>
